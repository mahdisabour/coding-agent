# Default configuration for coding agent

# Model settings
model:
  name: gpt-4-turbo-preview
  temperature: 0.1
  max_tokens: 4096

# Agent behavior
agent:
  max_iterations: 10
  enable_reflection: true

# Logging
logging:
  level: INFO
  # file: logs/agent.log

# Usage tracking
usage:
  track: true
  cost_per_million_input_tokens: 10.0
  cost_per_million_output_tokens: 30.0
